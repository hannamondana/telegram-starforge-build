name: Star Forge IPA

# Builds an unsigned IPA on a GitHub-hosted macOS runner, so no local Mac is
# required. The submodules are fetched at the exact commits pinned by upstream
# TelegramMessenger/Telegram-iOS master, so the source is pushed as plain files.
#
# Trigger from the "Actions" tab (Run workflow), or with:
#   gh workflow run build-starforge.yml
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner image (needs a recent Xcode)"
        required: false
        default: "macos-latest"
      xcode_version:
        description: "Xcode version (empty = auto-select from versions.json)"
        required: false
        default: ""
      build_number:
        description: "Build number"
        required: false
        default: "100001"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Submodules are NOT stored in this repository (the source was
          # uploaded as plain files). They are cloned in the next step at the
          # exact commits upstream pins.
          submodules: false
          fetch-depth: "0"

      - name: Select Xcode
        run: |
          set -eux
          WANT="${{ inputs.xcode_version }}"
          if [ -z "$WANT" ]; then
            WANT="$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')"
          fi
          echo "requested Xcode: $WANT"
          XCODE_OUT="$(xcodebuild -version 2>&1 || true)"
          echo "$XCODE_OUT"
          INSTALLED="$(printf '%s\n' "$XCODE_OUT" | awk 'NR==1{print $2}')"
          echo "installed Xcode: $INSTALLED"
          echo "available Xcodes on this runner:"
          ls /Applications | grep -i '^Xcode' || true
          if [ -d "/Applications/Xcode_${WANT}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${WANT}.app/Contents/Developer"
          else
            echo "::warning::Xcode ${WANT} is not present on this runner; building with ${INSTALLED}"
          fi
          xcodebuild -version || true

      - name: Fetch pinned submodules
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          # path, url, pinned commit (from TelegramMessenger/Telegram-iOS master)
          submodules = [
              ("submodules/rlottie/rlottie", "https://github.com/TelegramMessenger/rlottie.git", "53c9679069eb6b6513ccc3c892ef4f4a760658da"),
              ("build-system/bazel-rules/rules_apple", "https://github.com/ali-fareed/rules_apple.git", "485016eb5b0948cc17307064e7977a6d68e94046"),
              ("build-system/bazel-rules/rules_swift", "https://github.com/bazelbuild/rules_swift.git", "dd10a2497a691237eb9716586acee1a9c4fe3e59"),
              ("build-system/bazel-rules/apple_support", "https://github.com/bazelbuild/apple_support.git", "872de7149cfbcaaf854c7867e98b6d4798ba0d27"),
              ("submodules/TgVoipWebrtc/tgcalls", "https://github.com/TelegramMessenger/tgcalls.git", "8d6dd4c61e62965cb574c29e39327a4686066381"),
              ("third-party/libvpx/libvpx", "https://github.com/webmproject/libvpx.git", "e7bfd8b6c230a6824e7fd1efa2378a7322986128"),
              ("third-party/webrtc/webrtc", "https://github.com/ali-fareed/webrtc.git", "6513c71d6c80311d69a0a6b9c09fcf32cfbeb247"),
              ("build-system/bazel-rules/rules_xcodeproj", "https://github.com/MobileNativeFoundation/rules_xcodeproj.git", "f6a54168d19f917d0630e7d4efa8f2f9fa0ddc36"),
              ("third-party/dav1d/dav1d", "https://github.com/ali-fareed/dav1d.git", "330e20672e85f9de1678dccd6957845898ef57a1"),
              ("third-party/td/td", "https://github.com/tdlib/td", "e894536b2f46caad93f997448d2daff9431b19dd"),
              ("third-party/wallet-engine/wallet-engine", "https://github.com/i582/wallet-engine.git", "e59e0d89d7ee90c388bf36e3334c5b276f396697"),
              ("submodules/tlottie/tlottie", "https://github.com/dkaraush/tlottie.git", "92df98dc209bc39b1e567ec74a8c86a0af5239de"),
              ("third-party/mtproto-engine", "https://github.com/TelegramMessenger/mtproto-engine.git", "da4b2170210aab0430c4ff18c032991f3030cf45"),
          ]

          for path, url, sha in submodules:
              if os.path.isdir(path) and os.listdir(path):
                  print("already present:", path)
                  continue
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              print("cloning", path, "at", sha)
              try:
                  subprocess.check_call(["git", "clone", "--filter=blob:none", "--no-checkout", "--quiet", url, path])
                  subprocess.check_call(["git", "-C", path, "checkout", "--quiet", sha])
              except subprocess.CalledProcessError:
                  print("partial clone failed, falling back to full clone for", path)
                  if os.path.isdir(path):
                      subprocess.check_call(["rm", "-rf", path])
                  subprocess.check_call(["git", "clone", "--quiet", url, path])
                  subprocess.check_call(["git", "-C", path, "checkout", "--quiet", sha])
              try:
                  subprocess.check_call(["git", "-C", path, "submodule", "update", "--init", "--recursive", "--depth", "1"])
              except subprocess.CalledProcessError as exc:
                  print("::warning::nested submodules for {} not fully fetched: {}".format(path, exc))
          PY

      - name: Apply SDK compatibility patches
        run: |
          set -eux
          # Upstream master is written against the iOS 27.1 SDK, but the newest
          # Xcode on the hosted runners is 26.6 (iOS 26.5 SDK). `#available`
          # only guards *runtime* availability -- the compiler still has to
          # resolve every member against the SDK it is building with, so any
          # 27.x-only symbol is a hard error. There is exactly one such call in
          # the tree; stub it out. On a 26.5 SDK the code path could never run
          # anyway, and returning nil is its documented "not reported" value.
          python3 - <<'PY'
          import sys

          path = 'submodules/Display/Source/WindowContent.swift'
          with open(path, 'r', encoding='utf-8') as handle:
              source = handle.read()

          old = (
              '        if #available(iOS 27.1, *) {\n'
              '            return self.eventView.reservedRegions(kind: .division).first(where: \\.isActive)?.frame\n'
              '        }\n'
              '        return nil\n'
          )
          new = (
              '        // Star Forge: built against a pre-27.1 SDK, where\n'
              '        // `UIView.reservedRegions(kind:)` does not exist. The fold is\n'
              '        // therefore never reported, which is what this property\n'
              '        // returns before iOS 27.1 anyway.\n'
              '        return nil\n'
          )

          if 'reservedRegions(kind: .division)' not in source:
              print('Display/WindowContent.swift: no 27.1-only call left to patch')
              sys.exit(0)

          if old not in source:
              print('::error::unexpected formatting around the reservedRegions call in ' + path)
              sys.exit(1)

          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(source.replace(old, new, 1))
          print('patched', path)
          PY

      - name: Disable the SIL pass that crashes the compiler
        run: |
          set -eux
          # Swift 6.3.3 (Xcode 26.6) crashes while compiling the ShareScreen
          # module:
          #   While running pass "CopyPropagation" on SILFunction
          #     ...ShareScreen...init(context:subject:...)
          #     at Sources/ShareScreen.swift:322:12
          #   visitUsersOutsideLinearLivenessBoundary ->
          #     OSSACanonicalizeOwned::extendLexicalLivenessToDeadEnds ->
          #     llvm::report_fatal_error
          # The module's 37-argument initializer trips an OSSA lifetime
          # canonicalization bug in that pass. Upstream never sees it because
          # it builds with the 27.1 toolchain. CopyPropagation only forwards
          # copies, so disabling it keeps semantics identical; the cost is a
          # negligible amount of optimization in this one module.
          python3 - <<'PY'
          import sys

          path = 'submodules/TelegramUI/Components/ShareScreen/BUILD'
          with open(path, 'r', encoding='utf-8') as handle:
              source = handle.read()

          if 'sil-disable-pass=CopyPropagation' in source:
              print('ShareScreen/BUILD: pass already disabled')
              sys.exit(0)

          old = (
              '    copts = [\n'
              '        "-warnings-as-errors",\n'
              '    ],\n'
          )
          new = (
              '    copts = [\n'
              '        "-warnings-as-errors",\n'
              '        # Star Forge: Swift 6.3.3 crashes in CopyPropagation while\n'
              '        # canonicalizing OSSA lifetimes of the huge init below.\n'
              '        "-Xllvm",\n'
              '        "-sil-disable-pass=CopyPropagation",\n'
              '    ],\n'
          )

          if old not in source:
              print('::error::unexpected formatting of the ShareScreen copts block')
              sys.exit(1)

          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(source.replace(old, new, 1))
          print('patched', path)
          PY
          grep -n -A 6 'copts = \[' submodules/TelegramUI/Components/ShareScreen/BUILD

      - name: Restore executable bits on shell scripts
        run: |
          set -eux
          # Git only stores the executable bit in the index, and this repository
          # was uploaded as plain files, so the bit is gone. Bazel's ffmpeg
          # genrule copies submodules/ffmpeg/Sources/FFMpeg with `cp -R` and
          # then executes build-ffmpeg-bazel.sh (which in turn runs configure
          # and other helpers) from the copy, so the bit has to be set on the
          # workspace files before the build starts.
          chmod -R +x submodules/ffmpeg/Sources/FFMpeg
          find . -path ./.git -prune -o -name '*.sh' -type f -print0 \
            | xargs -0 -r chmod +x
          ls -l submodules/ffmpeg/Sources/FFMpeg/build-ffmpeg-bazel.sh

      - name: Refresh fake provisioning profiles
        run: |
          set -eux
          # The bundled Apple profiles expired on 2026-10-30. They cannot simply
          # be re-dated: BuildConfiguration.py decodes them with
          # `openssl smime -verify` (so they must stay real CMS blobs) and
          # plisttool rejects an ExpirationDate in the past. The script decodes
          # each one, re-dates it, and re-signs it with certs/SelfSigned.p12 --
          # the same flow GenerateProfiles.py uses. Idempotent.
          python3 build-system/fake-codesigning/refresh_profiles.py build-system/fake-codesigning

      - name: Verify provisioning profiles
        run: |
          set -eux
          # Decode exactly the way BuildConfiguration.py does, so a bad profile
          # fails here in seconds instead of after a long Bazel build.
          python3 - <<'PY'
          import datetime
          import glob
          import plistlib
          import subprocess
          import sys

          problems = []
          for path in sorted(glob.glob('build-system/fake-codesigning/profiles/*.mobileprovision')):
              name = path.replace('\\', '/').split('/')[-1]
              proc = subprocess.run(
                  ['openssl', 'smime', '-inform', 'der', '-verify', '-noverify', '-in', path],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if proc.returncode != 0:
                  problems.append('{}: openssl smime failed: {}'.format(
                      name, proc.stderr.decode('utf-8', 'replace').strip()))
                  continue
              try:
                  profile = plistlib.loads(proc.stdout)
              except Exception as error:
                  problems.append('{}: not a plist: {}'.format(name, error))
                  continue
              expiration = profile.get('ExpirationDate')
              if not expiration or expiration < datetime.datetime.now():
                  problems.append('{}: ExpirationDate {} is in the past'.format(name, expiration))
                  continue
              print('  {}: ok, expires {}'.format(name, expiration))

          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('All provisioning profiles are decodable and unexpired.')
          PY

      - name: Build the app
        run: |
          set -euxo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs || true
          # Tee the output so a failure can be summarised as annotations: the
          # raw job log needs a token to read, annotations do not.
          set +e
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${{ inputs.build_number }}" \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/build-artifacts" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "build failed with status $STATUS; surfacing errors below"
            grep -n -E "(error:|ERROR:|Error:|fatal error|failed:)" "$GITHUB_WORKSPACE/build.log" \
              | tail -n 40 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            exit "$STATUS"
          fi

      - name: Locate IPA
        id: locate
        run: |
          set -eux
          IPA="$GITHUB_WORKSPACE/build-artifacts/Telegram.ipa"
          if [ ! -f "$IPA" ]; then
            # Fallback: -quit stops find after the first hit, so nothing gets
            # SIGPIPE'd by an early-closing pipe reader (which breaks pipefail).
            IPA="$(find "$GITHUB_WORKSPACE" -name 'Telegram.ipa' -type f -print -quit)"
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error::Telegram.ipa was not produced"
            exit 1
          fi
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          cp "$IPA" "$GITHUB_WORKSPACE/Telegram.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: ${{ github.workspace }}/Telegram.ipa
          if-no-files-found: error
